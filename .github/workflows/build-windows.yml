name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Gerar pacote Windows
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Identificar versao do app
        id: app-version
        shell: pwsh
        run: |
          $appVersion = python -c "from financeiro.app_metadata import APP_VERSION; print(APP_VERSION)"
          $releaseTag = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") {
            $releaseTag = "v$appVersion"
          }
          $assetName = "Windows - $appVersion.zip"
          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Instalar dependencias de empacotamento
        run: python -m pip install --upgrade pip pyinstaller certifi cryptography==50.0.1

      - name: Validar Python
        shell: pwsh
        run: |
          $files = @("app.py") + (Get-ChildItem financeiro -Filter "*.py" | ForEach-Object { $_.FullName })
          python -m py_compile @files

      - name: Gerar executavel Windows
        shell: pwsh
        run: |
          $icon = "Sistema Financeiro - Distribuicao\Windows\Aplicativo\web\assets\app-icon.ico"
          $iconArgs = @()
          if (Test-Path $icon) {
            $iconArgs = @("--icon", $icon)
          }

          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --name SistemaFinanceiro `
            --add-data "web;web" `
            @iconArgs `
            app.py

      - name: Montar pacote de distribuicao
        shell: pwsh
        run: |
          $sourceRoot = "Sistema Financeiro - Distribuicao\Windows"
          $packageRoot = "artifact-output\Windows"
          $appRoot = "$packageRoot\Aplicativo"
          $runtimeRoot = "$appRoot\SistemaFinanceiro"

          if (Test-Path "artifact-output") {
            Remove-Item "artifact-output" -Recurse -Force
          }

          New-Item -ItemType Directory -Path $appRoot | Out-Null

          Copy-Item "$sourceRoot\Instalar Sistema Financeiro.bat" "$packageRoot\Instalar Sistema Financeiro.bat" -Force
          Copy-Item "$sourceRoot\README-INSTALACAO-WINDOWS.md" "$packageRoot\README-INSTALACAO-WINDOWS.md" -Force
          Copy-Item "$sourceRoot\configurar_windows.ps1" "$packageRoot\configurar_windows.ps1" -Force
          Copy-Item "$sourceRoot\Aplicativo\Abrir Sistema Financeiro.bat" "$appRoot\Abrir Sistema Financeiro.bat" -Force
          Copy-Item "$sourceRoot\Aplicativo\Abrir Sistema Financeiro na Rede.bat" "$appRoot\Abrir Sistema Financeiro na Rede.bat" -Force
          Copy-Item "dist\SistemaFinanceiro" $runtimeRoot -Recurse

          $forbidden = @("data", "secure", "tests", "docs", "__pycache__")
          foreach ($name in $forbidden) {
            Get-ChildItem $packageRoot -Recurse -Force -Directory -Filter $name |
              Remove-Item -Recurse -Force
          }

          Get-ChildItem $packageRoot -Recurse -Force -File -Include ".DS_Store", "._*" |
            Remove-Item -Force

      - name: Compactar pacote Windows
        shell: pwsh
        run: |
          $zipPath = "artifact-output\${{ steps.app-version.outputs.asset_name }}"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive `
            -Path "artifact-output\Windows" `
            -DestinationPath $zipPath `
            -Force

      - name: Validar conteudo do zip
        shell: pwsh
        run: |
          $zipPath = "artifact-output\${{ steps.app-version.outputs.asset_name }}"
          $items = tar -tf $zipPath

          $blocked = $items | Select-String '(^|/)(data|secure|tests|docs|__pycache__|\.DS_Store|_CodeSignature|__MACOSX|\._[^/]*)(/|$)|Windows/Aplicativo/app.py|Windows/Aplicativo/financeiro/|Windows/Aplicativo/web/| 2'
          if ($blocked) {
            Write-Error "O pacote contem arquivos ou pastas proibidas: $blocked"
            exit 1
          }

          $hasExe = $items | Select-String 'Windows/Aplicativo/SistemaFinanceiro/SistemaFinanceiro.exe$'
          if (-not $hasExe) {
            Write-Error "Executavel Windows nao encontrado no pacote."
            exit 1
          }

          $vendors = @("imask", "apexcharts")
          foreach ($vendor in $vendors) {
            $hasVendor = $items | Select-String "Windows/Aplicativo/SistemaFinanceiro/.*/web/vendor/$vendor/"
            if (-not $hasVendor) {
              Write-Error "Dependencia browser vendorizada ausente no runtime: $vendor"
              exit 1
            }
          }

      - name: Publicar artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.app-version.outputs.asset_name }}
          path: artifact-output/${{ steps.app-version.outputs.asset_name }}
          archive: false
          if-no-files-found: error

      - name: Publicar no GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.app-version.outputs.release_tag }}
          APP_VERSION: ${{ steps.app-version.outputs.app_version }}
          ASSET_PATH: artifact-output/${{ steps.app-version.outputs.asset_name }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" `
              --title "Sistema Financeiro $env:APP_VERSION" `
              --notes "Pacotes oficiais do Sistema Financeiro $env:APP_VERSION."
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Release pode ter sido criada por outro workflow; verificando novamente."
            }
          }
          gh release view "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          gh release upload "$env:RELEASE_TAG" "$env:ASSET_PATH" --clobber
