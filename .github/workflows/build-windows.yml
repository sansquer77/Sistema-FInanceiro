name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Gerar pacote Windows
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Validar Python
        shell: pwsh
        run: |
          $files = @("app.py") + (Get-ChildItem financeiro -Filter "*.py" | ForEach-Object { $_.FullName })
          python -m py_compile @files

      - name: Gerar executavel Windows
        shell: pwsh
        run: |
          $icon = "Sistema Financeiro - Distribuicao\Windows\Aplicativo\web\assets\app-icon.ico"
          $iconArgs = @()
          if (Test-Path $icon) {
            $iconArgs = @("--icon", $icon)
          }

          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --name SistemaFinanceiro `
            --add-data "web;web" `
            @iconArgs `
            app.py

      - name: Montar pacote de distribuicao
        shell: pwsh
        run: |
          $sourceRoot = "Sistema Financeiro - Distribuicao\Windows"
          $packageRoot = "artifact-output\Windows"
          $appRoot = "$packageRoot\Aplicativo"
          $runtimeRoot = "$appRoot\SistemaFinanceiro"

          if (Test-Path "artifact-output") {
            Remove-Item "artifact-output" -Recurse -Force
          }

          New-Item -ItemType Directory -Path $appRoot | Out-Null

          Copy-Item "$sourceRoot\Instalar Sistema Financeiro.bat" "$packageRoot\Instalar Sistema Financeiro.bat" -Force
          Copy-Item "$sourceRoot\README-INSTALACAO-WINDOWS.md" "$packageRoot\README-INSTALACAO-WINDOWS.md" -Force
          Copy-Item "$sourceRoot\configurar_windows.ps1" "$packageRoot\configurar_windows.ps1" -Force
          Copy-Item "$sourceRoot\Aplicativo\Abrir Sistema Financeiro.bat" "$appRoot\Abrir Sistema Financeiro.bat" -Force
          Copy-Item "$sourceRoot\Aplicativo\Abrir Sistema Financeiro na Rede.bat" "$appRoot\Abrir Sistema Financeiro na Rede.bat" -Force
          Copy-Item "dist\SistemaFinanceiro" $runtimeRoot -Recurse

          $forbidden = @("data", "tests", "docs", "__pycache__")
          foreach ($name in $forbidden) {
            Get-ChildItem $packageRoot -Recurse -Force -Directory -Filter $name |
              Remove-Item -Recurse -Force
          }

          Get-ChildItem $packageRoot -Recurse -Force -File -Include ".DS_Store", "._*" |
            Remove-Item -Force

      - name: Compactar pacote Windows
        shell: pwsh
        run: |
          $zipPath = "artifact-output\Sistema Financeiro - Distribuicao Windows.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive `
            -Path "artifact-output\Windows" `
            -DestinationPath $zipPath `
            -Force

      - name: Validar conteudo do zip
        shell: pwsh
        run: |
          $zipPath = "artifact-output\Sistema Financeiro - Distribuicao Windows.zip"
          $items = tar -tf $zipPath

          $blocked = $items | Select-String '(^|/)(data|tests|docs|__pycache__|\.DS_Store|_CodeSignature|__MACOSX|\._[^/]*)(/|$)|Windows/Aplicativo/app.py|Windows/Aplicativo/financeiro/|Windows/Aplicativo/web/| 2'
          if ($blocked) {
            Write-Error "O pacote contem arquivos ou pastas proibidas: $blocked"
            exit 1
          }

          $hasExe = $items | Select-String 'Windows/Aplicativo/SistemaFinanceiro/SistemaFinanceiro.exe$'
          if (-not $hasExe) {
            Write-Error "Executavel Windows nao encontrado no pacote."
            exit 1
          }

      - name: Publicar artifact
        uses: actions/upload-artifact@v7
        with:
          name: Sistema-Financeiro-Windows
          path: artifact-output/Sistema Financeiro - Distribuicao Windows.zip
          archive: false
          if-no-files-found: error
