name: Build MacOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Gerar pacote MacOS
    runs-on: macos-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Identificar versao do app
        id: app-version
        run: |
          APP_VERSION=$(python - <<'PY'
          from financeiro.app_metadata import APP_VERSION
          print(APP_VERSION)
          PY
          )
          RELEASE_TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            RELEASE_TAG="v${APP_VERSION}"
          fi
          ASSET_NAME="MacOS - ${APP_VERSION}.zip"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Validar Python
        run: |
          python -m py_compile app.py financeiro/*.py

      - name: Gerar executavel MacOS
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --name SistemaFinanceiro \
            --add-data "web:web" \
            app.py

      - name: Montar pacote de distribuicao
        run: |
          PACKAGE_ROOT="Sistema Financeiro - Distribuicao/MacOS"
          APP_ROOT="$PACKAGE_ROOT/Aplicativo"
          RUNTIME_ROOT="$APP_ROOT/SistemaFinanceiro"

          rm -rf "$RUNTIME_ROOT"
          cp -R "dist/SistemaFinanceiro" "$RUNTIME_ROOT"

          find "$PACKAGE_ROOT" \( \
            -name data -o \
            -name secure -o \
            -name tests -o \
            -name docs -o \
            -name __pycache__ -o \
            -name .DS_Store -o \
            -name _CodeSignature -o \
            -name '._*' -o \
            -name '* 2*' \
          \) -prune -exec rm -rf {} +

      - name: Compactar pacote MacOS
        run: |
          ZIP_PATH="Sistema Financeiro - Distribuicao/MacOS/${{ steps.app-version.outputs.asset_name }}"
          find "Sistema Financeiro - Distribuicao/MacOS" -maxdepth 1 -name '*.zip' -delete
          rm -f /tmp/sistema-financeiro-macos.zip

          cd "Sistema Financeiro - Distribuicao"
          /usr/bin/zip -r -X /tmp/sistema-financeiro-macos.zip MacOS
          mv /tmp/sistema-financeiro-macos.zip "MacOS/${{ steps.app-version.outputs.asset_name }}"

      - name: Validar conteudo do zip
        run: |
          ZIP_PATH="Sistema Financeiro - Distribuicao/MacOS/${{ steps.app-version.outputs.asset_name }}"
          zip -T "$ZIP_PATH"

          if unzip -Z1 "$ZIP_PATH" | grep -E '(^|/)(data|secure|tests|docs|__pycache__|\.DS_Store|_CodeSignature|\._[^/]*)(/|$)|MacOS/Aplicativo/app.py|MacOS/Aplicativo/financeiro/| 2'; then
            echo "O pacote contem arquivos, pastas proibidas ou duplicatas."
            exit 1
          fi

          unzip -Z1 "$ZIP_PATH" | grep -E 'MacOS/Aplicativo/SistemaFinanceiro/SistemaFinanceiro$'

      - name: Publicar artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.app-version.outputs.asset_name }}
          path: Sistema Financeiro - Distribuicao/MacOS/${{ steps.app-version.outputs.asset_name }}
          archive: false
          if-no-files-found: error

      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.app-version.outputs.release_tag }}
          APP_VERSION: ${{ steps.app-version.outputs.app_version }}
          ASSET_PATH: Sistema Financeiro - Distribuicao/MacOS/${{ steps.app-version.outputs.asset_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Sistema Financeiro ${APP_VERSION}" \
              --notes "Pacotes oficiais do Sistema Financeiro ${APP_VERSION}." || true
          fi
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" "$ASSET_PATH" --clobber
