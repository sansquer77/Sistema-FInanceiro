name: Build Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-linux:
    name: Gerar pacote Linux Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Validar Python
        run: |
          python -m py_compile app.py financeiro/*.py

      - name: Gerar executavel Linux
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --name SistemaFinanceiro \
            --add-data "web:web" \
            app.py

      - name: Montar pacote de distribuicao
        run: |
          PACKAGE_ROOT="Sistema Financeiro - Distribuicao/Linux"
          APP_ROOT="$PACKAGE_ROOT/Aplicativo"
          RUNTIME_ROOT="$APP_ROOT/SistemaFinanceiro"

          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$APP_ROOT"

          cp -R "dist/SistemaFinanceiro" "$RUNTIME_ROOT"
          cp README.md "$APP_ROOT/README.md"

          cat > "$APP_ROOT/Abrir Sistema Financeiro.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export APP_HOST="${APP_HOST:-127.0.0.1}"
          export APP_PORT="${APP_PORT:-8010}"
          export APP_URL="${APP_URL:-http://127.0.0.1:${APP_PORT}}"

          echo "Sistema Financeiro rodando em ${APP_URL}"
          exec "$SCRIPT_DIR/SistemaFinanceiro/SistemaFinanceiro"
          SCRIPT

          cat > "$APP_ROOT/Abrir Sistema Financeiro na Rede.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export APP_URL="${APP_URL:-https://sistema-financeiro.net:8030}"

          if command -v xdg-open >/dev/null 2>&1; then
            xdg-open "$APP_URL" >/dev/null 2>&1 &
          fi

          echo "Abrindo Sistema Financeiro em ${APP_URL}"
          SCRIPT

          cat > "$PACKAGE_ROOT/README-INSTALACAO-LINUX.md" <<'README'
          # Sistema Financeiro - Instalacao Linux Ubuntu

          ## Uso local

          1. Extraia este pacote.
          2. Abra um Terminal na pasta `Aplicativo`.
          3. Execute:

             ```bash
             chmod +x "Abrir Sistema Financeiro.sh"
             ./Abrir\ Sistema\ Financeiro.sh
             ```

          4. Acesse `http://127.0.0.1:8010` no navegador.

          ## Uso em rede

          Execute `Abrir Sistema Financeiro na Rede.sh` ou acesse diretamente:

          `https://sistema-financeiro.net:8030`
          README

          chmod +x "$APP_ROOT/"*.sh

          find "$PACKAGE_ROOT" \( \
            -name data -o \
            -name tests -o \
            -name docs -o \
            -name __pycache__ -o \
            -name .DS_Store -o \
            -name _CodeSignature -o \
            -name '._*' -o \
            -name '* 2*' \
          \) -prune -exec rm -rf {} +

      - name: Compactar pacote Linux
        run: |
          ZIP_PATH="Sistema Financeiro - Distribuicao/Linux/Sistema Financeiro - Distribuicao Linux.zip"
          rm -f "$ZIP_PATH" /tmp/sistema-financeiro-linux.zip

          cd "Sistema Financeiro - Distribuicao"
          /usr/bin/zip -r -X /tmp/sistema-financeiro-linux.zip Linux
          mv /tmp/sistema-financeiro-linux.zip "Linux/Sistema Financeiro - Distribuicao Linux.zip"

      - name: Validar conteudo do zip
        run: |
          ZIP_PATH="Sistema Financeiro - Distribuicao/Linux/Sistema Financeiro - Distribuicao Linux.zip"
          zip -T "$ZIP_PATH"

          if unzip -Z1 "$ZIP_PATH" | grep -E '(^|/)(data|tests|docs|__pycache__|\.DS_Store|_CodeSignature|\._[^/]*)(/|$)| 2'; then
            echo "O pacote contem arquivos, pastas proibidas ou duplicatas."
            exit 1
          fi

          unzip -Z1 "$ZIP_PATH" | grep -E 'Linux/Aplicativo/SistemaFinanceiro/SistemaFinanceiro$'

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sistema-Financeiro-Linux
          path: Sistema Financeiro - Distribuicao/Linux/Sistema Financeiro - Distribuicao Linux.zip
          if-no-files-found: error
